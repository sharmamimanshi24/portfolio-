/* Design: zinc-100 base, white cards, 1px #E4E4E7 borders, 4px max radius, one signal orange, green for status only. Single light theme by design. */
:root{ color-scheme:light; }
html,body{background:#F4F4F5;color:#18181B}
body{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:60;background:#F4F4F5}
.nav-sticky{top:env(safe-area-inset-top, 0px)}
.dot-grid{background-image:radial-gradient(#D4D4D8 1px, transparent 1px);background-size:20px 20px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 6s ease-in-out infinite}
.bob-2{animation:bob 7s ease-in-out infinite .8s}
.bob-3{animation:bob 8s ease-in-out infinite 1.6s}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(22,163,74,.45)}100%{box-shadow:0 0 0 10px rgba(22,163,74,0)}}
.ring-pulse{animation:ring 1.2s ease-out 2}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.grow{transform-origin:left;animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes blink{50%{opacity:0}}
.caret{display:inline-block;width:7px;height:14px;background:#18181B;vertical-align:-2px;animation:blink 1s steps(1) infinite}
:focus-visible{outline:2px solid #FF4F00;outline-offset:2px}
.t-k{color:#7C3AED}.t-s{color:#0F766E}.t-t{color:#1D4ED8}.t-n{color:#FF4F00}.t-c{color:#A1A1AA}
@media (prefers-reduced-motion: reduce){ .bob,.bob-2,.bob-3,.grow,.ring-pulse,.caret{animation:none!important} *{transition:none!important;scroll-behavior:auto!important} }

/* ================= HOOKS ================= */
function useScrollY(){
  const [y,setY]=useState(0);
  useEffect(()=>{ let raf=0; const on=()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>setY(window.scrollY)); };
    on(); addEventListener('scroll',on,{passive:true}); addEventListener('resize',on); return ()=>{ removeEventListener('scroll',on); removeEventListener('resize',on); }; },[]);
  return y;
}
function useInView(){
  const ref=useRef(null); const [seen,setSeen]=useState(true);
  useLayoutEffect(()=>{ const el=ref.current; if(!el) return;
    if (el.getBoundingClientRect().top < innerHeight*0.95 || REDUCED || !('IntersectionObserver' in window)) { setSeen(true); return; }
    setSeen(false);
    const io=new IntersectionObserver(([e])=>{ if(e.isIntersecting){ setSeen(true); io.disconnect(); } },{rootMargin:'0px 0px -8% 0px'});
    io.observe(el); return ()=>io.disconnect(); },[]);
  return [ref,seen];
}
function useIsWide(px){ const [w,setW]=useState(()=>innerWidth>=px); useEffect(()=>{ const on=()=>setW(innerWidth>=px); addEventListener('resize',on); return ()=>removeEventListener('resize',on); },[px]); return w; }

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hlTS(code){
  const re=/(\/\/.*$)|("[^"]*")|\b(export|interface|type|const|as)\b|\b(string|number|boolean|Promise|Track|Severity|[A-Z][A-Za-z]+(?=\s*[{=<;]))\b|\b(\d+(?:\.\d+)?)\b/gm;
  let out='', last=0, m;
  while((m=re.exec(code))){ out+=esc(code.slice(last,m.index));
    if(m[1]) out+='<span class="t-c">'+esc(m[1])+'</span>'; else if(m[2]) out+='<span class="t-s">'+esc(m[2])+'</span>';
    else if(m[3]) out+='<span class="t-k">'+m[3]+'</span>'; else if(m[4]) out+='<span class="t-t">'+m[4]+'</span>'; else out+='<span class="t-n">'+m[5]+'</span>';
    last=re.lastIndex; }
  return out+esc(code.slice(last));
}

    return html`<div className="grid gap-4">
      <p className="text-[13px] text-zinc-600 leading-relaxed">You’re on message 20 of a long chat. Each square is one earlier message. Which ones does the AI read before it replies?</p>

      <${Row} label="Memory AI" note="only the 5 that matter" isMem=${true}/>
      <p className="text-[13px] text-zinc-600 leading-relaxed">Reading less makes replies faster and cheaper. Memory AI also keeps what you told it in earlier chats, so it doesn’t forget you.</p></div>`; }
  if (p.viz==='bars') return html`<div className="grid gap-4">
    ${[['Direct question','0%',0],['Describe voice first','87.5%',87.5]].map(([l,v,w])=>html`<div key=${l} className="grid gap-1.5"><span className="text-xs text-zinc-500">${l}</span>
      <div className="relative h-7 bg-zinc-100 rounded-sm overflow-hidden"><div className="grow absolute inset-y-0 left-0 bg-zinc-900" style=${{width: Math.max(w,1)+'%'}}></div>
      <span className=${'absolute top-1/2 -translate-y-1/2 left-3 font-mono text-xs font-medium '+(w>50?'text-white':'text-zinc-700')}>${v}</span></div></div>`)}
    <span className="font-mono text-[11px] text-zinc-400">SALMONN-7B · identical clips</span></div>`;
  if (p.viz==='funnel') return html`<div className="grid gap-3">
    ${[['All rows','100%',100],['Flagged broken','19.7%',19.7],['Left for manual review','7.9%',7.9]].map(([l,v,w])=>html`<div key=${l} className="grid gap-1"><span className="flex justify-between text-xs text-zinc-500"><span>${l}</span><span className="font-mono text-zinc-900">${v}</span></span>
      <div className="h-2 bg-zinc-100 rounded-sm overflow-hidden"><div className="grow h-full bg-zinc-900" style=${{width:w+'%'}}></div></div></div>`)}</div>`;
  if (p.viz==='garv') return html`<div className="grid gap-3 text-[13px]">
    <div className="bg-white border border-zinc-200 rounded-sm p-3 text-zinc-700 leading-relaxed">“Megha arrived in a white silk saree, holding jasmine, her heart heavy as she prepared to say her final goodbye. Is she at a wedding or a funeral?”</div>
    ${[['Generator','Says “wedding”. White silk saree and jasmine read as a celebration.',''],
       ['Auditor','Flags cultural bias: in Indian culture, white is the colour of mourning.','flag'],
       ['Refiner','Rewrites the answer without that assumption.',''],
       ['Verifier','Confirms the bias is gone and scores the new answer.','']].map(([n,t,f],i)=>html`<div key=${n} className="flex gap-3 items-start">
      <span className=${'w-6 h-6 shrink-0 grid place-items-center font-mono text-[11px] rounded-sm border '+(f?'border-[#FF4F00] text-[#FF4F00]':'border-zinc-300')}>${i+1}</span>
      <span className="grid"><span className="font-medium text-zinc-900">${n}</span><span className="text-zinc-600">${t}</span></span></div>`)}</div>`;
  if (p.viz==='verdict') return html`<div className="grid gap-3 text-[13px]">
    <div className="grid gap-1"><${Label} className="text-zinc-400">Topic<//><span className="text-zinc-800">Remote work is better than working from office</span></div>
    <div className="grid grid-cols-2 gap-2"><div className="bg-white border border-zinc-200 rounded-sm p-3"><${Label} className="text-zinc-400">For<//><div className="mt-1">Gemma</div></div><div className="bg-white border border-zinc-200 rounded-sm p-3"><${Label} className="text-zinc-400">Against<//><div className="mt-1">Mistral</div></div></div>
    <div className="bg-white border border-zinc-900 rounded-sm p-3 grid gap-1"><span className="flex justify-between"><${Label} className="text-zinc-900">Judge · Qwen<//><span className="font-mono text-zinc-900">72% confident</span></span>
      <span className="text-zinc-700">Winner: Gemma. It backed claims with specific examples and answered counterpoints directly.</span></div></div>`;
  if (p.viz==='compare') return html`<div className="grid gap-3">
    ${[['ResNet-50',87.2,false],['ResNeXt-50',89.1,false],['Mine: ResNeSt-50 + attention',92.4,true]].map(([l,v,me])=>html`<div key=${l} className="grid gap-1"><span className="flex justify-between text-xs"><span className=${me?'text-zinc-900 font-medium':'text-zinc-500'}>${l}</span><span className="font-mono text-zinc-900">${v}%</span></span>

  return html`<div className="grid gap-2 content-start">${p.metrics.map(([k,v])=>html`<div key=${k} className="flex justify-between border-b border-dashed border-zinc-200 pb-2 text-sm"><span className="text-zinc-500">${k}</span><span className="font-mono">${v}</span></div>`)}</div>`;

/* ================= ⌘K AGENT ================= */
function Agent({open,onClose,onAction}){
  const [q,setQ]=useState(''); const [ans,setAns]=useState(null); const [shown,setShown]=useState(''); const inputRef=useRef(null);
  useEffect(()=>{ if(open){ setQ(''); setAns(null); setShown(''); setTimeout(()=>inputRef.current&&inputRef.current.focus(),0); } },[open]);
  useEffect(()=>{ if(!ans) return; if(REDUCED){ setShown(ans.a); return; } let i=0; setShown(''); const t=setInterval(()=>{ i+=2; setShown(ans.a.slice(0,i)); if(i>=ans.a.length) clearInterval(t); },16); return ()=>clearInterval(t); },[ans]);
  if(!open) return null;
  const ask = text=>{ const t=text.trim().toLowerCase(); const hit = AGENT_QA.find(x=>x.q.toLowerCase()===t) || AGENT_QA.find(x=>x.k.test(text)) || {a:'I only know what’s on this page. Try asking about NIIT, DRDO, her projects, education, or whether she’s open to roles.'}; setAns(hit); };
  return html`<div className="fixed inset-0 z-[100] bg-zinc-900/20 backdrop-blur-sm flex justify-center items-start px-4" style=${{paddingTop:'calc(12vh + env(safe-area-inset-top, 0px))'}} onClick=${e=>{ if(e.target===e.currentTarget) onClose(); }} role="dialog" aria-modal="true" aria-label="Query agent">
    <div className="w-full max-w-[560px] bg-white border border-zinc-200 rounded shadow-[0_20px_60px_-20px_rgba(24,24,27,.35)] overflow-hidden">
      <form onSubmit=${e=>{e.preventDefault(); ask(q);}} className="flex items-center gap-3 px-4 py-3 border-b border-zinc-200">
        <span className="font-mono text-[#FF4F00]">›</span>
        <input ref=${inputRef} id="agent-q" value=${q} onInput=${e=>setQ(e.target.value)} placeholder="Ask about Mimanshi's journey..." className="flex-1 min-w-0 bg-transparent outline-none text-[15px]" autoComplete="off"/>
        <${Kbd}>esc<//>
      </form>
      <div className="p-4 grid gap-4">
        ${ans ? html`<div className="grid gap-3"><div className="font-mono text-[11px] text-zinc-400">agent.response</div>
          <p className="text-[15px] leading-relaxed text-zinc-800 min-h-[3em]">${shown}${shown.length<ans.a.length&&html`<span className="caret ml-0.5"></span>`}</p>
          ${ans.go && shown.length>=ans.a.length && html`<button onClick=${()=>{ onAction(ans); onClose(); }} className="justify-self-start font-mono text-[11px] uppercase tracking-[0.12em] border border-zinc-300 hover:border-zinc-900 rounded px-3 py-1.5">Take me there →</button>`}
        </div>` : html`<div className="font-mono text-[11px] text-zinc-400">Try asking</div>`}
        <div className="flex flex-wrap gap-2">${AGENT_QA.map(x=>html`<button key=${x.q} onClick=${()=>{ setQ(x.q); ask(x.q); }} className="text-[13px] bg-zinc-50 border border-zinc-200 hover:border-zinc-900 rounded px-3 py-1.5">${x.q}</button>`)}</div>
      </div>
      <div className="px-4 py-2.5 border-t border-zinc-200 bg-zinc-50 font-mono text-[10.5px] text-zinc-400">Canned answers from this page. No live model is called.</div>
    </div></div>`;
}

}
